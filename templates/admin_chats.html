{% extends "base.html" %}
{% block content %}
<style>
  .chat-container { display: flex; height: calc(100vh - 150px); background: #fff; border-radius: 16px; border: 1px solid var(--line); overflow: hidden; margin-top: 20px; }
  .chat-sidebar { width: 300px; border-right: 1px solid var(--line); overflow-y: auto; background: #f8fafc; flex-shrink: 0; }
  .chat-user-row { padding: 16px; border-bottom: 1px solid var(--line); cursor: pointer; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; }
  .chat-user-row:hover, .chat-user-row.active { background: #fff; border-left: 4px solid var(--primary); }
  .chat-user-row .name { font-weight: 700; color: var(--text); }
  .chat-user-row .last-msg { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; margin-top: 4px; }
  .chat-user-row .badge { background: #ef4444; color: #fff; font-size: 12px; padding: 2px 6px; border-radius: 10px; font-weight: bold; }
  
  .chat-main { flex: 1; display: flex; flex-direction: column; background: #fff; }
  .chat-header { padding: 16px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 18px; background: #fff; }
  .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #f8fafc; }
  
  .msg-bubble { max-width: 70%; padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.5; word-break: break-word; }
  .msg-user { background: #fff; border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 4px; color: var(--text); }
  .msg-admin { background: var(--primary); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg-time { font-size: 11px; margin-top: 4px; opacity: 0.7; text-align: right; }
  
  .chat-input-area { padding: 16px; border-top: 1px solid var(--line); display: flex; gap: 10px; background: #fff; }
  .chat-input-area input { margin: 0; border-radius: 24px; padding: 12px 20px; flex: 1; }
  .chat-input-area button { border-radius: 24px; padding: 0 24px; width: auto; }
  
  .empty-chat { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--muted); flex-direction: column; gap: 10px; }
</style>

<div style="max-width: 1000px; margin: 40px auto; padding: 0 16px;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <h1 style="margin:0;">💬 แชทลูกค้า</h1>
    <a href="{{ url_for('admin_dashboard') }}" class="btn ghost" style="width:auto;">← กลับหลังบ้าน</a>
  </div>

  <div class="chat-container">
    <!-- Sidebar รายชื่อลูกค้า -->
    <div class="chat-sidebar" id="chatSidebar">
      {% for c in chat_list %}
      <div class="chat-user-row" data-user-id="{{ c.user.id }}" onclick="loadChat({{ c.user.id }}, this)">
        <div>
          <div class="name">{{ c.user.username }}</div>
          <div class="last-msg">{{ c.last_msg.message }}</div>
        </div>
        {% if c.unread > 0 %}
        <div class="badge">{{ c.unread }}</div>
        {% endif %}
      </div>
      {% else %}
      <div style="padding: 20px; text-align: center; color: var(--muted);">ยังไม่มีข้อความ</div>
      {% endfor %}
    </div>

    <!-- พื้นที่แชท -->
    <div class="chat-main" id="chatMain">
      <div class="empty-chat" id="emptyChat">
        <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
        <span>เลือกลูกค้าเพื่อเริ่มสนทนา</span>
      </div>
      
      <div id="activeChat" style="display:none; flex-direction:column; height:100%;">
        <div class="chat-header" id="chatHeaderName"></div>
        <div class="chat-messages" id="chatMessageBox"></div>
        <div class="chat-input-area">
          <input type="text" id="adminMsgInput" placeholder="พิมพ์ข้อความตอบกลับ..." onkeypress="handleEnter(event)">
          <button class="btn" onclick="sendAdminMsg()">ส่ง</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  let currentUserId = null;
  let pollInterval = null;

  function loadChat(userId, el) {
    currentUserId = userId;
    document.getElementById('emptyChat').style.display = 'none';
    document.getElementById('activeChat').style.display = 'flex';
    
    // Highlight active
    document.querySelectorAll('.chat-user-row').forEach(r => r.classList.remove('active'));
    if (el) {
      el.classList.add('active');
      const badge = el.querySelector('.badge');
      if (badge) badge.remove(); // ลบแจ้งเตือนเมื่อเปิดอ่าน
    }
    
    fetchMessages();
    
    if (pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(fetchMessages, 3000); // รีเฟรชทุก 3 วิ
  }

  async function fetchMessages() {
    if (!currentUserId) return;
    try {
      const res = await fetch(`/api/admin/chat/${currentUserId}`);
      const data = await res.json();
      
      if (data.ok) {
        document.getElementById('chatHeaderName').textContent = data.username;
        const box = document.getElementById('chatMessageBox');
        box.innerHTML = '';
        
        data.messages.forEach(m => {
          const div = document.createElement('div');
          div.className = `msg-bubble ${m.is_from_admin ? 'msg-admin' : 'msg-user'}`;
          div.innerHTML = `${m.message}<div class="msg-time">${m.time}</div>`;
          box.appendChild(div);
        });
        
        box.scrollTop = box.scrollHeight;
      }
    } catch (e) { console.log(e); }
  }

  async function sendAdminMsg() {
    if (!currentUserId) return;
    const input = document.getElementById('adminMsgInput');
    const txt = input.value.trim();
    if (!txt) return;
    
    input.value = '';
    try {
      await fetch(`/api/admin/chat/${currentUserId}`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message: txt})
      });
      fetchMessages();
    } catch (e) { alert('ส่งไม่สำเร็จ'); }
  }

  function handleEnter(e) {
    if (e.key === 'Enter') sendAdminMsg();
  }
</script>
{% endblock %}
