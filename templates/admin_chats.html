{% extends "base.html" %}
{% block content %}
<style>
  .admin-chat-wrap { display: flex; height: 75vh; max-width: 1000px; margin: 30px auto; background: #fff; border-radius: 16px; border: 1px solid var(--line); overflow: hidden; box-shadow: var(--shadow); }
  .user-list { width: 300px; border-right: 1px solid var(--line); overflow-y: auto; background: #f8fafc; flex-shrink: 0; }
  .user-list h3 { padding: 16px; margin: 0; font-size: 16px; border-bottom: 1px solid var(--line); background: #fff; display: flex; justify-content: space-between; align-items: center; }
  .user-item { display: block; padding: 14px 16px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--text); cursor: pointer; transition: background 0.2s; }
  .user-item:hover, .user-item.active { background: var(--primary-soft); border-left: 4px solid var(--primary); }
  .user-item .name { font-weight: 700; font-size: 15px; display: block; }
  
  .chat-area { flex: 1; display: flex; flex-direction: column; background: #fff; position: relative; }
  .chat-header-admin { padding: 16px 20px; border-bottom: 1px solid var(--line); font-weight: 700; background: #fff; }
  .chat-box-admin { flex: 1; padding: 20px; overflow-y: auto; background: #f8fafc; display: flex; flex-direction: column; gap: 12px; }
  
  .msg-row { display: flex; width: 100%; } .msg-row.user { justify-content: flex-start; } .msg-row.admin { justify-content: flex-end; }
  .msg-bubble { max-width: 70%; padding: 10px 16px; border-radius: 18px; font-size: 14px; line-height: 1.5; position: relative; word-wrap: break-word; }
  .msg-row.user .msg-bubble { background: #fff; border: 1px solid var(--line); color: #333; border-bottom-left-radius: 4px; }
  .msg-row.admin .msg-bubble { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
  .msg-time { font-size: 11px; opacity: 0.6; margin-top: 4px; display: block; text-align: right; }
  .msg-bubble img { max-width: 100%; border-radius: 8px; margin-top: 6px; cursor: pointer; }
  
  .chat-input-admin { padding: 16px; background: #fff; border-top: 1px solid var(--line); display: flex; gap: 10px; }
  .chat-input-admin input { margin: 0; border-radius: 8px; padding: 12px 16px; border: 1px solid var(--line); flex: 1; }
  
  .empty-state { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; color: var(--muted); }
  .refresh-btn { background: #e2e8f0; border: none; padding: 4px 8px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 700; }
</style>

<div style="max-width: 1000px; margin: 0 auto; padding: 20px 16px;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h1 style="margin: 0;">💬 ศูนย์แชตลูกค้า</h1>
    <a href="{{ url_for('admin_dashboard') }}" class="btn ghost" style="width: auto;">← กลับหลังบ้าน</a>
  </div>

  <div class="admin-chat-wrap">
    <div class="user-list">
      <h3>
        รายชื่อผู้ติดต่อ
        <button class="refresh-btn" onclick="forceReloadList()">🔄 โหลดใหม่</button>
      </h3>
      <div id="userListContainer">
        {% for u in chat_users %}
          <div class="user-item" data-id="{{ u.id }}" onclick="openChat({{ u.id }}, '{{ u.username.split('@')[0] }}')">
            <span class="name">👤 {{ u.username.split('@')[0] }}</span>
          </div>
        {% else %}
          <div style="padding: 20px; text-align: center; color: var(--muted); font-size: 13px;" id="noUserMsg">ยังไม่มีใครทักมา</div>
        {% endfor %}
      </div>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="empty-state" id="emptyState">
        <p>เลือกผู้ใช้เพื่อเริ่มตอบแชต</p>
      </div>

      <div id="activeChat" style="display: none; flex: 1; flex-direction: column; height: 100%;">
        <div class="chat-header-admin"><span id="chatWithName">ชื่อผู้ใช้</span></div>
        <div class="chat-box-admin" id="chatBoxAdmin"></div>
        <form class="chat-input-admin" id="chatFormAdmin">
          <input type="text" id="msgInputAdmin" placeholder="พิมพ์ตอบกลับ..." autocomplete="off" required>
          <button type="submit" class="btn">ส่ง</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  let currentUserId = null;
  let lastMsgCount = 0;

  const chatBox = document.getElementById('chatBoxAdmin');
  const chatForm = document.getElementById('chatFormAdmin');
  const msgInput = document.getElementById('msgInputAdmin');
  const userListContainer = document.getElementById('userListContainer');

  // ฟังก์ชันโหลดรายชื่อ
  async function forceReloadList() {
    try {
      const res = await fetch("{{ url_for('api_chat_users') }}");
      const data = await res.json();

      if (data.ok) {
        if (data.users.length === 0) {
          userListContainer.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--muted); font-size: 13px;">ยังไม่มีใครทักมา</div>';
        } else {
          userListContainer.innerHTML = '';
          data.users.forEach(u => {
            const div = document.createElement('div');
            div.className = 'user-item';
            div.dataset.id = u.id;
            div.onclick = () => openChat(u.id, u.username);
            div.innerHTML = `<span class="name">👤 ${u.username}</span>`;
            userListContainer.appendChild(div);
          });
        }
      }
    } catch (e) { console.error(e); }
  }

  function openChat(userId, username) {
    currentUserId = userId;
    lastMsgCount = 0;
    chatBox.innerHTML = '';
    
    document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
    const currentItem = document.querySelector(`.user-item[data-id="${userId}"]`);
    if (currentItem) currentItem.classList.add('active');

    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('activeChat').style.display = 'flex';
    document.getElementById('chatWithName').textContent = 'คุยกับ: ' + username;

    loadAdminMessages();
  }

  async function loadAdminMessages() {
    if (!currentUserId) return;
    try {
      const res = await fetch(`/api/chat/messages?user_id=${currentUserId}`);
      const data = await res.json();
      
      if (data.ok && data.messages.length !== lastMsgCount) {
        lastMsgCount = data.messages.length;
        chatBox.innerHTML = '';
        data.messages.forEach(m => appendMessage(m.message, m.sender, m.time));
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    } catch (e) { console.error(e); }
  }

  function appendMessage(text, sender, time) {
    const row = document.createElement('div');
    row.className = `msg-row ${sender}`;
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    if (text.startsWith('data:image/')) bubble.innerHTML = `<img src="${text}" onclick="window.open(this.src)">`;
    else bubble.innerHTML = text;
    bubble.innerHTML += `<span class="msg-time">${time || 'เมื่อสักครู่'}</span>`;
    row.appendChild(bubble);
    chatBox.appendChild(row);
  }

  chatForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = msgInput.value.trim();
    if (!text || !currentUserId) return;

    msgInput.value = '';
    appendMessage(text, 'admin', 'เมื่อสักครู่');
    chatBox.scrollTop = chatBox.scrollHeight;

    await fetch(`/api/chat/send`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, target_id: currentUserId })
    });
    loadAdminMessages();
  });

  // รีเฟรชข้อความทุก 3 วิ
  setInterval(() => {
    if(currentUserId) loadAdminMessages();
  }, 3000);

</script>
{% endblock %}
