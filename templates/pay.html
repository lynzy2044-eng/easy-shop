{% extends "base.html" %}
{% block content %}

<!-- Modal Overlay พื้นหลังเบลอ -->
<div class="modal-overlay">
  
  <!-- ตัวการ์ด Popup -->
  <div class="modal-content">
    
    <!-- Header: ชื่อร้าน + ปุ่มปิด -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
      <div>
        <div class="muted" style="font-size:14px;">ชำระเงิน</div>
        <div style="font-weight:800; font-size:20px;">{{ package.name }}</div>
      </div>
      <a href="{{ url_for('index') }}" class="btn-close">✕</a>
    </div>

    <!-- QR Code Box (พื้นหลังสีเทาเข้ม ในภาพเป็นสีดำ แต่ผมปรับเป็นสีเทาอ่อนให้เข้ากับธีมขาว) -->
    <div style="background:#0f172a; border-radius:16px; padding:24px; text-align:center; margin-bottom:24px;">
      <div style="display:flex; justify-content:space-between; color:#fff; margin-bottom:16px; font-size:14px;">
        <span>สแกน QR พร้อมเพย์</span>
        <span style="color:#38bdf8; font-weight:700;">฿{{ "%.2f"|format(amount) }}</span>
      </div>
      <!-- รูป QR -->
      <div style="background:#fff; padding:12px; border-radius:12px; display:inline-block; margin-bottom:12px;">
        <img src="{{ qr }}" alt="PromptPay QR" style="width:180px; height:180px; display:block;">
      </div>
      <div style="color:#94a3b8; font-size:13px;">สแกนแล้วโอน {{ amount }} บาท ระบบจะตรวจสอบทันที</div>
    </div>

    <!-- ฟอร์มส่งสลิป -->
    <form method="post" enctype="multipart/form-data">
      
      <label style="color:var(--muted); font-size:14px;">แนบสลิปโอนเงิน</label>
      <label for="slipUpload" style="display:flex; flex-direction:column; align-items:center; justify-content:center; border:2px dashed var(--line); border-radius:12px; padding:24px; cursor:pointer; background:#f8fafc; transition:var(--transition); margin-bottom:16px;" onmouseover="this.style.borderColor='var(--primary)'" onmouseout="this.style.borderColor='var(--line)'">
        <svg width="24" height="24" fill="none" stroke="var(--muted)" stroke-width="2" viewBox="0 0 24 24" style="margin-bottom:8px;"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
        <span style="font-weight:600; font-size:14px; color:var(--text);" id="fileNameDisplay">กดเพื่ออัปโหลดรูปสลิป</span>
        <span style="font-size:12px; color:var(--muted); margin-top:4px;">JPG, PNG ขนาดไม่เกิน 5MB</span>
        <input type="file" name="slip" id="slipUpload" accept="image/*" required style="display:none;" onchange="document.getElementById('fileNameDisplay').innerText = this.files[0].name;">
      </label>

      <button class="btn" type="submit" style="width:100%; border-radius:12px;">ยืนยันการชำระเงิน →</button>
      
    </form>
    
    <div style="text-align:center; margin-top:16px; font-size:12px; color:var(--muted);">
      หากระบบไม่ตอบสนอง โปรดรอสักครู่แล้วลองใหม่
    </div>

  </div>
</div>

{% endblock %}
