{% extends "base.html" %}
{% block content %}
<style>
  .chat-container { max-width: 800px; margin: 30px auto; background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); overflow: hidden; display: flex; flex-direction: column; height: 75vh; border: 1px solid var(--line); }
  .chat-header { background: var(--primary); color: #fff; padding: 16px 20px; display: flex; align-items: center; gap: 12px; z-index: 10; }
  .chat-header h2 { margin: 0; font-size: 18px; font-weight: 700; }
  .chat-box { flex: 1; padding: 20px; overflow-y: auto; background: #f8fafc; display: flex; flex-direction: column; gap: 16px; }
  .msg-row { display: flex; width: 100%; } .msg-row.user { justify-content: flex-end; } .msg-row.admin { justify-content: flex-start; }
  .msg-bubble { max-width: 70%; padding: 10px 16px; border-radius: 18px; font-size: 15px; line-height: 1.5; position: relative; word-wrap: break-word; }
  .msg-row.user .msg-bubble { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
  .msg-row.admin .msg-bubble { background: #fff; color: #333; border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg-time { font-size: 11px; opacity: 0.6; margin-top: 4px; text-align: right; display: block; }
  .msg-row.admin .msg-time { text-align: left; }
  .msg-bubble img { max-width: 100%; border-radius: 8px; margin-top: 6px; cursor: pointer; }

  .chat-input-area { padding: 12px 16px; background: #fff; border-top: 1px solid var(--line); display: flex; align-items: flex-end; gap: 10px; position: relative; }
  .input-wrapper { flex: 1; background: #f1f5f9; border-radius: 20px; padding: 8px 16px; display: flex; align-items: center; min-height: 44px; }
  .input-wrapper input { border: none; background: transparent; width: 100%; outline: none; font-size: 15px; padding: 0; margin: 0; }
  .icon-btn { background: transparent; border: none; cursor: pointer; padding: 8px; display: flex; align-items: center; justify-content: center; color: var(--primary); border-radius: 50%; }
  .icon-btn svg { width: 24px; height: 24px; fill: currentColor; }
  .send-btn { background: var(--primary); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .send-btn svg { width: 20px; height: 20px; fill: currentColor; margin-left: 2px; }

  .typing-indicator { display: none; padding: 12px 16px; background: #fff; border-radius: 18px; border-bottom-left-radius: 4px; width: fit-content; border: 1px solid var(--line); margin-top: 5px; }
  .typing-indicator span { display: inline-block; width: 6px; height: 6px; background: #94a3b8; border-radius: 50%; margin: 0 2px; animation: bounce 1.4s infinite ease-in-out both; }
  .typing-indicator span:nth-child(1) { animation-delay: -0.32s; } .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

  .attachment-popup { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000; display: flex; align-items: flex-end; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.3s; padding: 20px; }
  .attachment-popup.active { opacity: 1; visibility: visible; }
  .attachment-menu { background: #fff; width: 100%; max-width: 400px; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 16px; transform: translateY(20px); transition: transform 0.3s; }
  .attachment-popup.active .attachment-menu { transform: translateY(0); }
  .attachment-item { display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 12px; cursor: pointer; font-weight: 600; }
  .attachment-item:hover { background: #f1f5f9; }
  .att-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; }
  .att-icon.photo { background: #8b5cf6; }

  .emoji-picker { position: absolute; bottom: 80px; left: 20px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); display: none; grid-template-columns: repeat(6, 1fr); gap: 8px; z-index: 50; }
  .emoji-picker.active { display: grid; }
  .emoji-picker span { font-size: 24px; cursor: pointer; padding: 4px; border-radius: 8px; }
  .emoji-picker span:hover { background: #f1f5f9; }
  .guest-note { text-align: center; color: #94a3b8; margin-top: 20px; font-size: 14px; }
</style>

<div class="chat-container">
  <div class="chat-header">
    <h2>แชตกับแอดมิน</h2>
  </div>

  <div class="chat-box" id="chatBox">
    {% if user %}
    <div class="welcome" style="text-align:center; color:#94a3b8; margin-top:20px; font-size:14px;">👋 สวัสดีครับ มีอะไรให้แอดมินช่วยไหม?</div>
    {% else %}
    <div class="guest-note">กรุณา <a href="{{ url_for('login', next=request.path) }}">เข้าสู่ระบบ</a> เพื่อแชตกับแอดมิน</div>
    {% endif %}
  </div>

  {% if user %}
  <div style="padding: 0 20px; background: #f8fafc;">
    <div class="typing-indicator" id="adminTyping"><span></span><span></span><span></span></div>
  </div>

  <form class="chat-input-area" id="chatForm">
    <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(this)">
    <button type="button" class="icon-btn" id="attachBtn"><svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg></button>
    <button type="button" class="icon-btn" id="emojiBtn"><svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg></button>
    <div class="input-wrapper">
      <input type="text" id="msgInput" placeholder="พิมพ์ข้อความ..." autocomplete="off">
    </div>
    <button type="submit" class="send-btn"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
  </form>

  <div class="attachment-popup" id="attachmentPopup">
    <div class="attachment-menu">
      <h3 style="margin: 0 0 10px; text-align: center; font-size: 16px;">แนบไฟล์</h3>
      <div class="attachment-item" onclick="document.getElementById('fileInput').click(); closeAttachmentPopup();">
        <div class="att-icon photo"><svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg></div>
        <span>รูปภาพ</span>
      </div>
      <button class="btn ghost" onclick="closeAttachmentPopup()" style="margin-top: 10px;">ยกเลิก</button>
    </div>
  </div>

  <div class="emoji-picker" id="emojiPicker">
    <span>😀</span><span>😂</span><span>🥰</span><span>😎</span><span>😭</span><span>😡</span>
    <span>👍</span><span>👎</span><span>🙏</span><span>👏</span><span>🔥</span><span>💯</span>
  </div>
  {% endif %}
</div>

{% if user %}
<script src="https://js.pusher.com/8.4.0/pusher.min.js"></script>
<script>
  const chatBox = document.getElementById('chatBox');
  const chatForm = document.getElementById('chatForm');
  const msgInput = document.getElementById('msgInput');
  const adminTyping = document.getElementById('adminTyping');
  const emojiPicker = document.getElementById('emojiPicker');
  const attachmentPopup = document.getElementById('attachmentPopup');

  const pusher = new Pusher('{{ pusher_key }}', {
    cluster: '{{ pusher_cluster }}',
    channelAuthorization: { endpoint: '{{ url_for("pusher_auth") }}' }
  });
  const channel = pusher.subscribe('private-user-{{ user.id }}');

  let seen = new Set();
  let typingTimer = null, lastTypingSent = 0;

  function makeWelcome() {
    const d = document.createElement('div');
    d.className = 'welcome';
    d.style.cssText = 'text-align:center; color:#94a3b8; margin-top:20px; font-size:14px;';
    d.textContent = '👋 สวัสดีครับ มีอะไรให้แอดมินช่วยไหม?';
    return d;
  }

  function makeRow(m) {
    const row = document.createElement('div');
    row.className = `msg-row ${m.sender}`;
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    if (m.body.startsWith('/api/chat/image/')) {
      const img = document.createElement('img');
      img.src = m.body;
      img.onclick = () => window.open(img.src);
      bubble.appendChild(img);
    } else {
      bubble.textContent = m.body;          // ไม่ใช้ innerHTML กัน XSS
    }
    const t = document.createElement('span');
    t.className = 'msg-time';
    t.textContent = m.time || '';
    bubble.appendChild(t);
    row.appendChild(bubble);
    return row;
  }

  function appendMsg(m) {
    if (seen.has(m.id)) return;
    seen.add(m.id);
    const w = chatBox.querySelector('.welcome');
    if (w) w.remove();
    chatBox.appendChild(makeRow(m));
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function showAdminTyping() {
    adminTyping.style.display = 'block';
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => adminTyping.style.display = 'none', 2500);
  }

  // โหลดประวัติของตัวเอง
  async function loadHistory() {
    const res = await fetch("{{ url_for('api_chat_messages') }}");
    const data = await res.json();
    chatBox.innerHTML = '';
    if (!data.messages.length) chatBox.appendChild(makeWelcome());
    data.messages.forEach(appendMsg);
    chatBox.scrollTop = chatBox.scrollHeight;
  }
  loadHistory();

  channel.bind('new_message', m => {
    appendMsg(m);
    if (m.sender === 'admin') adminTyping.style.display = 'none';
  });
  channel.bind('client-typing', showAdminTyping);

  msgInput.addEventListener('input', () => {
    if (!channel.subscribed) return;
    const now = Date.now();
    if (now - lastTypingSent > 1500) {
      channel.trigger('client-typing', {});
      lastTypingSent = now;
    }
  });

  function sendMessage(body) {
    return fetch("{{ url_for('api_chat_send') }}", {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: body })
    }).then(res => {
      if (!res.ok) alert('ส่งไม่สำเร็จ (ข้อความอาจยาวเกินไปหรือรูปใหญ่เกินไป)');
    });
  }

  chatForm.addEventListener('submit', e => {
    e.preventDefault();
    const text = msgInput.value.trim();
    if (!text) return;
    msgInput.value = '';
    sendMessage(text);
  });

  // ส่งรูป
  function handleFileSelect(input) {
    const file = input.files[0];
    input.value = '';
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) { alert('รูปต้องไม่เกิน 2MB'); return; }
    const reader = new FileReader();
    reader.onload = e => sendMessage(e.target.result);
    reader.readAsDataURL(file);
  }

  // popup แนบไฟล์ และ emoji
  document.getElementById('attachBtn').addEventListener('click', () => attachmentPopup.classList.add('active'));
  function closeAttachmentPopup() { attachmentPopup.classList.remove('active'); }
  attachmentPopup.addEventListener('click', e => { if (e.target === attachmentPopup) closeAttachmentPopup(); });

  document.getElementById('emojiBtn').addEventListener('click', e => { e.stopPropagation(); emojiPicker.classList.toggle('active'); });
  document.addEventListener('click', e => { if (!emojiPicker.contains(e.target) && e.target.id !== 'emojiBtn') emojiPicker.classList.remove('active'); });
  emojiPicker.querySelectorAll('span').forEach(span => {
    span.addEventListener('click', () => { msgInput.value += span.textContent; msgInput.focus(); });
  });
</script>
{% endif %}
{% endblock %}
