<style>
  .adm-wrap { display: flex; height: 70vh; max-width: 1000px; margin: 0 auto 30px; background: #fff;
              border-radius: 16px; border: 1px solid var(--line); overflow: hidden; box-shadow: var(--shadow); }
  .adm-list { width: 260px; border-right: 1px solid var(--line); overflow-y: auto; background: #f8fafc; flex-shrink: 0; }
  .adm-list h3 { margin: 0; padding: 14px 16px; font-size: 16px; background: #fff; border-bottom: 1px solid var(--line); }
  .adm-item { padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
  .adm-item:hover, .adm-item.active { background: var(--primary-soft, #eff6ff); border-left: 4px solid var(--primary); }
  .adm-badge { background: #ef4444; color: #fff; border-radius: 999px; font-size: 12px; padding: 2px 8px; }
  .adm-empty { padding: 20px; text-align: center; color: var(--muted); font-size: 13px; }
  .adm-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .adm-head { padding: 14px 20px; border-bottom: 1px solid var(--line); font-weight: 700; }
  .adm-box { flex: 1; padding: 20px; overflow-y: auto; background: #f8fafc; display: flex; flex-direction: column; gap: 12px; }
  .adm-row { display: flex; width: 100%; }
  .adm-row.user { justify-content: flex-start; }
  .adm-row.admin { justify-content: flex-end; }
  .adm-bubble { max-width: 70%; padding: 10px 16px; border-radius: 18px; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
  .adm-row.user .adm-bubble { background: #fff; border: 1px solid var(--line); color: #333; }
  .adm-row.admin .adm-bubble { background: var(--primary); color: #fff; }
  .adm-time { display: block; font-size: 11px; opacity: .6; margin-top: 4px; text-align: right; }
  .adm-typing { display: none; padding: 0 20px 6px; font-size: 13px; color: var(--muted); }
  .adm-form { display: flex; gap: 10px; padding: 14px; border-top: 1px solid var(--line); }
  .adm-form input { flex: 1; margin: 0; padding: 12px 16px; border: 1px solid var(--line); border-radius: 8px; }
  @media (max-width: 640px) { .adm-list { width: 130px; } }
</style>

<div class="adm-wrap">
  <div class="adm-list">
    <h3>รายชื่อผู้ติดต่อ</h3>
    <div id="adm-list"></div>
  </div>
  <div class="adm-main">
    <div class="adm-head" id="adm-name">เลือกผู้ใช้เพื่อเริ่มตอบแชต</div>
    <div class="adm-box" id="adm-box"></div>
    <div class="adm-typing" id="adm-typing">ผู้ใช้กำลังพิมพ์...</div>
    <form class="adm-form" id="adm-form">
      <input type="text" id="adm-input" placeholder="พิมพ์ตอบกลับ..." autocomplete="off">
      <button class="btn" type="submit" style="width:auto;">ส่ง</button>
    </form>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<script src="{{ url_for('static', filename='js/chat_admin.js') }}"></script>
